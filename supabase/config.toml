
# verify_jwt=false is LOAD-BEARING for these two — a bulk
# `functions deploy` without flags resets it to true (happened
# 2026-08-20 and broke Colab bundle upload + the ocean-maps cron).
# Keeping it here makes the CLI apply it on every deploy.
[functions.mint-model-upload-url]
verify_jwt = false

[functions.refresh-ocean-maps]
verify_jwt = false

# Called by the external daily health-check job with x-api-key only —
# no user JWT. Auth is HEALTH_API_KEY inside the function.
[functions.health-report]
verify_jwt = false

# Cron-invoked with CRON_SECRET header — no user JWT.
[functions.weekly-report-generate]
verify_jwt = false

[functions.weekly-report-send]
verify_jwt = false

# Cron-invoked (pg_net, x-cron-secret) — no user JWT.
[functions.auto-update-regulations]
verify_jwt = false

# The /testers form fires this directly after a successful insert, from
# a signed-OUT browser — a tester has no account. A database webhook
# also calls it with no user JWT. Either way there is no session to
# verify; the function accepts a webhook-shaped body and only ever
# sends an internal alert.
[functions.notify-tester-feedback]
verify_jwt = false
